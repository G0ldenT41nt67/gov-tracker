name: Deploy site
# Publishes the site when its code or written content changes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/**', '!site/data/money.json', '!site/data/congress.json', '!site/data/members.json', '!site/data/meta.json']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
